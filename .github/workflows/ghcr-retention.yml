name: GHCR retention

# Every build on main publishes an image. This keeps the newest versions (weeks of builds to roll
# back to) and deletes the rest. A build is a few versions (index, image, attestations) plus the
# build cache's; they are created together and age out together.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: innestemme
          package-type: container
          min-versions-to-keep: 150
