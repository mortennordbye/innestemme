name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the image job opts into packages:write.
permissions:
  contents: read

# A new push supersedes the run in flight; main still runs to completion so a promoted image is
# never built from a superseded commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Clippy & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # voice-client links ALSA through cpal. Cached: apt-get update alone takes most of a minute.
      - name: Install ALSA headers
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libasound2-dev pkg-config
          version: 1

      # rust-toolchain.toml pins the version; this installs it.
      - name: Install toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Pull requests read main's cache but cannot share their own with other branches.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # Backstop for commits made anywhere: AI attribution never lands in the history, since removing it
  # afterwards means rewriting that history. Runs on pull requests and on direct pushes to main.
  attribution:
    name: Attribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Reject AI attribution in commit messages and identities
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A first push or a manual run has no usable base: check the whole history then.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then range="$HEAD"; else range="$BASE..$HEAD"; fi
          agents='claude|anthropic|codex|openai|chatgpt|copilot|gemini|cursor|jules|devin|aider'
          messages=$(git log --format='%H%n%B' "$range" | grep -inE \
            "^[[:space:]]*(claude-session:|(co-authored-by|assisted-by|generated-by|signed-off-by|reviewed-by):.*($agents))|generated (with|by) \\[?($agents)|(created|made|written) (with|by) \\[?($agents)|claude\\.(ai|com)/|🤖" || true)
          identities=$(git log --format='%H %an <%ae> / %cn <%ce>' "$range" | grep -iE "$agents|noreply@anthropic" | grep -v 'dependabot\[bot\]' || true)
          if [ -n "$messages$identities" ]; then
            echo "::error::AI attribution found"
            printf '%s\n' "$messages" "$identities"
            exit 1
          fi
          echo "clean: $(git rev-list --count "$range") commit(s)"

  # Whether a push to main changed anything the image is built from: a new image restarts the pod,
  # and a docs-only push has no business doing that.
  changes:
    name: Changes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        # A diff that cannot be taken (first push, manual run) builds: when in doubt, ship.
        run: |
          set +e
          git diff --quiet "$BEFORE" HEAD -- . ':(exclude)*.md' ':(exclude)docs/**' ':(exclude).github/*.md'
          rc=$?
          set -e
          if [ "$rc" = 0 ]; then echo "build=false" >> "$GITHUB_OUTPUT"; else echo "build=true" >> "$GITHUB_OUTPUT"; fi

  # linux/amd64 only: the binary is built for x86-64-v3 and the cluster has no other architecture.
  image:
    name: Build image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.build == 'true'
    needs: [verify, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      # The scan below files what it finds under Security > Code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The SemVer tag a Kargo Warehouse promotes, greatest first. The commit time only grows on
      # main; a run number starts again at 1 when a workflow is renamed or recreated.
      - id: version
        run: echo "tag=0.0.$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.version.outputs.tag }}
      # Build once, prove it starts, then push: an image tagged latest that cannot start is the
      # one CI failure that reaches the cluster.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: innestemme:smoke
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
      - name: Smoke-test the image
        run: |
          docker run -d --name smoke -p 9090:9090 innestemme:smoke --processor passthrough
          ok=
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9090/healthz; then ok=1; break; fi
            sleep 2
          done
          docker logs smoke
          test -n "$ok"
      # Two passes: everything HIGH and CRITICAL goes to Security > Code scanning; the gate fails
      # only on CRITICAL with a fix available, so an unpatched base-image CVE does not stop a deploy.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: innestemme:smoke
          format: sarif
          # Outside the checkout: a new file in the build context makes the push build below
          # recompile the workspace instead of reusing the first build.
          output: ${{ runner.temp }}/trivy.sarif
          severity: HIGH,CRITICAL
          scanners: vuln
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: ${{ runner.temp }}/trivy.sarif
          category: trivy-image
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: innestemme:smoke
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln
          skip-setup-trivy: true
          skip-db-update: true
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # In the registry beside the image rather than the Actions cache, which is capped at 10 GB.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
          sbom: true
          provenance: mode=max
