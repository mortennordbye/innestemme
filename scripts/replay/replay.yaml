# Replay (scripts/replay/run.sh): the cluster's behaviour settings, against the fake satellite in
# continuous mode and the fake Home Assistant. Answers go to an announce player, as in the cluster, so
# the follow-up window and the Voice PE's runs work the same; the fake never makes the call.
# Left out: Hue, Plex, the device wake words (the fake satellite has none; the engine hears the wake
# word itself), timers and notes files, the unhandled log and recordings.
