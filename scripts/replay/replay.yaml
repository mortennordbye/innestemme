public-url: http://127.0.0.1:9290
threads: 6
wake-name: Jarvis
honorific: sir
honorific-female: ma'am
home: Oslo
norwegian: false
english-tts: kokoro-onnx
kokoro-voice: am_onyx
listener: parakeet
speaker: Living Room
home-room: Living Room
norwegian-groceries: true
satellite: 127.0.0.1:16153
wake-model: hey_jarvis
wake-threshold: 0.65
wake-check-from: 0.15
answer-player: media_player.living_room
answer-volume: 0.50
