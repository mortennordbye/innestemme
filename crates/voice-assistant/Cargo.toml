[package]
name = "voice-assistant"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
candle = { version = "0.9.1", package = "candle-core" }
candle-nn = "0.9.1"
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq", "rustls-tls"] }
candle-transformers = "0.9.1"
hound = "3.5"
jiff = { version = "0.2", features = ["serde"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = "1.13.8"
sha2 = "0.10.9"
tracing.workspace = true
tract-onnx = "0.23.8"
ureq = { version = "3", features = ["json"] }
voice-proto.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true

[features]
# Apple GPU for Whisper. For local testing on a Mac; the cluster runs on CPU.
metal = ["candle/metal", "candle-nn/metal"]
