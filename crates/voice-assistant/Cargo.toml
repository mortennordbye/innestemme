[package]
name = "voice-assistant"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
bzip2 = "0.6"
candle = { version = "0.9.1", package = "candle-core" }
candle-nn = "0.9.1"
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq", "rustls-tls"] }
candle-transformers = "0.9.1"
jiff = { version = "0.2", features = ["serde"] }
# Phonon text to speech; files are fetched with hf-hub above, so only the tokenizer feature.
ptts = { version = "0.7.1", default-features = false, features = ["hf"] }
# Phonon's tensor runtime, only to size its thread pool.
xn = "0.2.15"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = "2.0.1"
sha2 = "0.11.1"
tar = "0.4"
tracing.workspace = true
tract-onnx = "0.23.8"
ureq = { version = "3", features = ["json"] }
voice-rt.workspace = true
voice-proto.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true

[features]
# Apple GPU for Whisper. For local testing on a Mac; the cluster runs on CPU.
metal = ["candle/metal", "candle-nn/metal"]
