[package]
name = "voice-assistant"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
candle = { version = "0.9.1", package = "candle-core" }
candle-nn = "0.11.0"
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq", "rustls-tls"] }
candle-transformers = "0.9.1"
hound = "3.5"
jiff = { version = "0.2", features = ["serde"] }
moshi = "0.6.4"
ptts = "0.2.3"
rand = "0.9"
rand_distr = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
tracing.workspace = true
ureq = { version = "2", features = ["json"] }
voice-proto.workspace = true
xn = "0.2.4"

[dev-dependencies]
tracing-subscriber.workspace = true

[features]
# Apple GPU for the STT model. For local testing on a Mac; the cluster runs on CPU.
metal = ["candle/metal", "candle-nn/metal", "moshi/metal"]
