[package]
name = "voice-esphome"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.22"
snow = { version = "0.10", default-features = false, features = ["default-resolver", "std", "use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
hound = "3.5"
tokio = { workspace = true, features = ["rt-multi-thread"] }
